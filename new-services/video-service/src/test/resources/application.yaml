spring:
  datasource:
    url: jdbc:h2:mem:video_service_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false

video:
  storage:
    base-path: target/test-storage

kafka:
  topics:
    video-uploaded: video.uploaded
    processing-completed: video.processing.completed
    processing-failed: video.processing.failed
