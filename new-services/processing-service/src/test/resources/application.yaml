spring:
  datasource:
    url: jdbc:h2:mem:processing_service_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8089/realms/vidio/protocol/openid-connect/certs

storage:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: vidio-videos-test
    access-key: minioadmin
    secret-key: minioadmin
    path-style-access: true

kafka:
  topics:
    video-uploaded: video.uploaded
    processing-completed: video.processing.completed
    processing-failed: video.processing.failed
