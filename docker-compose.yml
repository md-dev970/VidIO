services:
  postgres:
    image: postgres:16
    container_name: video-platform-postgres
    environment:
      POSTGRES_DB: video_platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: video-platform-kafka
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: video-platform-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"

  minio:
    image: minio/minio:latest
    container_name: video-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: video-platform-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      VIDIO_SMTP_HOST: ${VIDIO_SMTP_HOST:-mailpit}
      VIDIO_SMTP_PORT: ${VIDIO_SMTP_PORT:-1025}
      VIDIO_SMTP_FROM: ${VIDIO_SMTP_FROM:-no-reply@vidio.local}
      VIDIO_SMTP_USER: ${VIDIO_SMTP_USER:-local}
      VIDIO_SMTP_PASSWORD: ${VIDIO_SMTP_PASSWORD:-local}
      VIDIO_SMTP_AUTH: ${VIDIO_SMTP_AUTH:-false}
      VIDIO_SMTP_STARTTLS: ${VIDIO_SMTP_STARTTLS:-false}
    ports:
      - "8080:8080"
      - "8089:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import

  mailpit:
    image: axllent/mailpit:latest
    container_name: video-platform-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  video-service:
    build:
      context: ./new-services/video-service
    container_name: video-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vidio/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: vidio-videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      S3_PRESIGNED_URL_EXPIRATION_MINUTES: 10
    ports:
      - "8082:8082"

  processing-service:
    build:
      context: ./new-services/processing-service
    container_name: processing-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vidio/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: vidio-videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
    ports:
      - "8083:8083"

  api-service:
    build:
      context: ./new-services/api-service
    container_name: api-service
    depends_on:
      video-service:
        condition: service_started
      processing-service:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      VIDEO_SERVICE_BASE_URL: http://video-service:8082
      PROCESSING_SERVICE_BASE_URL: http://processing-service:8083
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vidio/protocol/openid-connect/certs
    ports:
      - "8081:8081"

  admin-dashboard:
    build:
      context: ./admin-dashboard
    container_name: admin-dashboard
    depends_on:
      api-service:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8088:80"

volumes:
  postgres-data:
  minio-data:
