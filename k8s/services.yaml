apiVersion: v1
kind: Service
metadata:
  name: video-service
  namespace: vidio
spec:
  selector:
    app: video-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
  namespace: vidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-service
  template:
    metadata:
      labels:
        app: video-service
    spec:
      containers:
        - name: video-service
          image: vidio-video-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: vidio-config
            - secretRef:
                name: vidio-secrets
---
