apiVersion: v1
kind: ConfigMap
metadata:
  name: vidio-config
  namespace: vidio
data:
  POSTGRES_DB: video_platform_db
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform_db
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/vidio/protocol/openid-connect/certs
  VIDEO_SERVICE_BASE_URL: http://video-service:8082
  PROCESSING_SERVICE_BASE_URL: http://processing-service:8083
  S3_REGION: us-west-2
  S3_BUCKET: replace-me
  S3_ENDPOINT: ""
  S3_PUBLIC_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_PATH_STYLE_ACCESS: "false"
  S3_PRESIGNED_URL_EXPIRATION_MINUTES: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: vidio-secrets
  namespace: vidio
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: replace-me
  VIDIO_SMTP_HOST: smtp-relay.brevo.com
  VIDIO_SMTP_PORT: "587"
  VIDIO_SMTP_FROM: no-reply@vidio.md-dev970.com
  VIDIO_SMTP_USER: replace-me
  VIDIO_SMTP_PASSWORD: replace-me
  VIDIO_SMTP_AUTH: "true"
  VIDIO_SMTP_STARTTLS: "true"
